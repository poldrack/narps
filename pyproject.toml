[project]
name = "narps"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Russell Poldrack", email = "poldrack@gmail.com" }
]
requires-python = "==3.12.*"
dependencies = [
    "colorama>=0.4.6",
    "extract>=1.0",
    "icecream>=2.1.4",
    "ipython>=8.32.0",
    "jupyter>=1.1.1",
    "jupytext>=1.16.7",
    "matplotlib>=3.10.0",
    "nibabel>=5.3.2",
    "nilearn>=0.11.1",
    "nipy>=0.6.1",
    "nipype>=1.9.2",
    "numpy>=2.2.3",
    "openpyxl>=3.1.5",
    "pandas>=2.2.3",
    "pillow>=11.1.0",
    "pynv>=0.3",
    "pytest>=8.3.4",
    "python-dotenv>=1.0.1",
    "radon>=6.0.1",
    "requests>=2.32.3",
    "scikit-learn>=1.6.1",
    "scipy>=1.15.2",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.4",
    "wget>=3.2",
    "xlrd>=2.0.1",
]

[project.scripts]
PreprocessMaps = "narps.PreprocessMaps:main"
PrepareMetadata = "narps.PrepareMetadata:main"
AnalyzeMaps = "narps.AnalyzeMaps:main"
ConsensusAnalysis = "narps.ConsensusAnalysis:main"
MetaAnalysis = "narps.MetaAnalysis:main"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
